name: docs

# Validates the canonical documentation corpus: front matter, authority tiers,
# supersession symmetry, registry references, and index freshness.
# This is the first required check in the repository -- CLAUDE.md's merge rule
# "all required checks pass" was previously vacuous.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Full history: check_gates.py diffs against the merge base to see what a pull
      # request actually changes. A shallow clone has no merge base to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Validate documentation
        run: python3 scripts/validate_docs.py

      - name: Verify index is current
        run: |
          python3 scripts/build_index.py
          if ! git diff --quiet docs/DOCUMENTATION_INDEX.md; then
            echo "::error::docs/DOCUMENTATION_INDEX.md is stale. Run scripts/build_index.py and commit."
            git diff docs/DOCUMENTATION_INDEX.md
            exit 1
          fi

      # Human gates, per .agentic/registries/gates.yaml. Advisory for now: it reports
      # which gates a change opens without failing the build, so the gate debt already
      # on `main` can be cleared before the rule starts blocking. Add `--strict` to
      # enforce, and move the six path-triggered gates to enforcement `check` in the
      # same change -- the registry should not claim a stage the pipeline is not at.
      - name: Check human gates
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/check_gates.py --base "origin/${{ github.base_ref }}"
