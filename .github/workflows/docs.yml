name: docs

# Validates the canonical documentation corpus: front matter, authority tiers,
# supersession symmetry, registry references, and index freshness.
# This is the first required check in the repository -- CLAUDE.md's merge rule
# "all required checks pass" was previously vacuous.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Full history: check_gates.py diffs against the merge base to see what a pull
      # request actually changes. A shallow clone has no merge base to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Validate documentation
        run: python3 scripts/validate_docs.py

      - name: Verify index is current
        run: |
          python3 scripts/build_index.py
          if ! git diff --quiet docs/DOCUMENTATION_INDEX.md; then
            echo "::error::docs/DOCUMENTATION_INDEX.md is stale. Run scripts/build_index.py and commit."
            git diff docs/DOCUMENTATION_INDEX.md
            exit 1
          fi

      # Human gates, per .agentic/registries/gates.yaml. Blocking as of WI-0013: the gate
      # debt on `main` was cleared by APR-0007..0010, and the six path-triggered gates now
      # carry enforcement `check` to match. An open gate fails the build, which is the
      # point -- merging is not a closure surface (ADR-019), so without this nothing in
      # the pipeline can stop an unapproved gated change.
      - name: Check human gates
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/check_gates.py --strict --base "origin/${{ github.base_ref }}"
