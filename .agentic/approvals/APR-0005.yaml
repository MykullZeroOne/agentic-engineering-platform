request: >
  Reported that every tier-0 specification was `draft` with human_approved: false, so by
  AUTHORITY_MODEL's own precedence rule the document defining authority carried none --
  and that gates.yaml had no trigger covering tier 0 at all. Proposed adding a
  constitutional_change gate and approving only the four stable specifications, leaving
  CONTENT_HASHING and ENTITY_MODEL draft because both are actively contested.

statement: >
  Approve the four stable specs and add constitutional_change gate

scope_note: >
  Approves SPEC-AUTHORITY, SPEC-LIFECYCLE, SPEC-REGISTRIES and SPEC-GLOSSARY only.

  Deliberately NOT approved and still draft: SPEC-CONTENT-HASHING (its computation was
  rewritten today and ADR-019 proposes changing what binds to it) and SPEC-ENTITY-MODEL
  and its data file (41 entities with 17 unanswered open questions). Draft is the correct
  status for both, not a compromise.

  SPEC-GLOSSARY was corrected before approval, not after: its work-item entry still
  asserted that GitHub is authoritative for work state, which ADR-012 v2 superseded.
  Approving first and correcting after would have changed the content hash and invalidated
  this record immediately.

  ADR-019 is proposed in the same change and, if accepted, adds `approval_record` to the
  front-matter contract. That is a material change to SPEC-LIFECYCLE and will re-open its
  gate. It is approved as it stands today, not as it will stand after.
