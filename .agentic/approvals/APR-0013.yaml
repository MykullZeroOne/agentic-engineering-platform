request: >
  Reported that nine artifacts at tiers 0 and 1 were passing the now-blocking gate check
  unverified, because they are approved or accepted but could not carry an approval record:
  the validator required approval_record: null on them, so writing one failed the build.
  Verified by walking full git history that every one has had exactly one body since
  introduction, and proposed retroactive records on that basis.

statement: >
  do WI-0005 -- re-anchor by attestation. It's no longer tidying: nine tier-0/tier-1
  artifacts, including every original ADR, now pass a blocking check unverified.

  -- with "Attest, write the records" selected.

scope_note: >
  approved_on is 2026-08-29, the date in each artifact's front matter, not today. The
  decisions were accepted then; only their records are written now.

  These eight predate the ADR structure requirement (Context, Decision, Alternatives
  considered, Consequences, Risks), which the validator applies from ADR-009 onward. That
  grandfathering is unaffected: this record binds their content, not their shape, and
  ADR-009's structural rule was never retroactive. ADRs are immutable once merged, so
  binding them by hash costs nothing and detects the edit that should never happen.
