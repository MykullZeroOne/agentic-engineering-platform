scope_note: >
  Approves .agentic/registries/vocabularies.yaml at the whole-file content it carries in PR #25.
  The substance is two new closed vocabularies sourced from docs/memory/KNOWLEDGE_GRAPH.md, and
  no change to any existing vocabulary.

  Approving a CLOSED namespace is approving a constraint, not a list. The consequence was stated
  before approval and is restated here: the first artifact that does not fit a listed node type
  becomes an error rather than a new type. That is the intended behaviour and it will be
  inconvenient at some point.

  What this does NOT approve:

  - It does not approve the ten new node types or six new edge types as CORRECT. Nothing
    consumes them; no graph exists. This approves adding them to the registry, and being wrong
    about a type costs another platform_config change per correction.
  - It does not adopt Kairo's PRODUCED, VALIDATED or FAILED edges. Those were judged synonyms of
    PRODUCED_BY, VERIFIED_BY and FAILED_BECAUSE and dropped. If Kairo meant something narrower
    by any of them, that meaning is lost and the loss is recorded here.
  - It does not register the role kinds (`agent`, `mcp`) that SPEC-CAPABILITIES names in prose.
    That remains an open limit recorded in that document.
