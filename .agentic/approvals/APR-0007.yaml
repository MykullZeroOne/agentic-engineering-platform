scope_note: >
  Approves SPEC-CAPABILITIES (draft v1 -> approved), SPEC-LIFECYCLE (proposed v2 ->
  approved) and SPEC-REGISTRIES (proposed v2 -> approved). Nothing else.

  Deliberately NOT approved, all of which the audit found uncovered under
  constitutional_change: SPEC-CONTENT-HASHING (draft v2), SPEC-ENTITY-MODEL and
  entity-model.yaml (draft, 17 open questions), SPEC-LOCAL-WORK-STORE (draft) and
  PRODUCT-VISION (draft). APR-0005 held the first three back for reasons that still hold.

  PRINCIPLES is uncovered and stays uncovered: it is in the validator's
  PRE_RECORD_APPROVALS set, which requires approval_record: null. It predates approval
  records and needs the ADR-016 attestation route (WI-0005), not a record.

  The instruction naming the gates was not treated as naming the artifacts. The scope
  above came from an explicit question and an explicit answer, because "close the gates"
  identifies no version and the closure rule requires one.
