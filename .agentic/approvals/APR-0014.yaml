scope_note: >
  Approves docs/spec/CAPABILITIES.md at the content it carries in PR #24. The substance is the
  Principals section: three principal types, the rule that an agent is a token rather than a
  principal type, `on_behalf_of` as audit-only attribution, and scope as the mechanism by which
  the most specific assignment wins.

  What this does NOT approve, stated because a reader of this record should not infer it:

  - It does not resolve WI-0016. The document says so explicitly: a principal model lets AEP's
    own records distinguish author from reviewer, and ADR-018's App is what would make GitHub
    see a distinct actor. Independent review remains suspended.
  - It approves a specification with no implementation. No user, team or token record exists
    anywhere in .agentic/, which the document records as a known limit.
  - It does not add the role kinds to the vocabulary registry. `agent` and `mcp` are named in
    prose here and are not registry tokens, which is a separate platform_config change.

  Narrowing risk worth recording: Kairo's source model carried six roles and a full permission
  matrix built for multi-tenant hosting. The principal model was taken and the role tiers were
  declined, because AEP has no tenancy. If AEP later needs role tiers, this is where they were
  left out.
