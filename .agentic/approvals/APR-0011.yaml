scope_note: >
  Approves gates.yaml and hooks.yaml at the content they carry in this change:

    - enforcement `prose` -> `check` on the six path-triggered gates. The other six stay
      `prose`; they trigger on classification, finding, lifecycle or capability, and
      claiming `check` for them would make the registry assert a stage no check reaches.
    - CLAUDE.md removed as a platform_config trigger path, added by WI-0014 one change ago.
      Gating the agent guide made every wording fix an approval event. The policy inside it
      still needs a gate, which is WI-0020, blocked on tier 3 existing at all.
    - work.advance_state bound under after_merge, class soft, matching the three bindings
      already there. Declarative until a hook engine exists.

  What this approval does NOT cover, because it is code rather than configuration:
  check_gates.py gaining --strict behaviour in CI, and its new handling of artifacts that
  predate approval records. That handling matters enough to state here. PRINCIPLES and
  ADR-001..008 are approved or accepted and cannot carry a record -- the validator requires
  approval_record: null on them -- so under a blocking check they would have been
  permanently unmergeable. They are now reported as GRAND and do not block, and the summary
  says a path was waved through rather than claiming every gate is closed.

  That is a deliberate hole, sized and named: nine artifacts at tiers 0 and 1 whose content
  no record verifies. ADR-016 attestation (WI-0005) is what closes it. Approving this change
  is approving that hole staying open in exchange for the check being enforceable at all.
