request: >
  Asked two questions before pushing, because --strict makes the answer decide whether CI is
  red. First, whether to approve the platform_config change: six path-triggered gates moving
  from enforcement `prose` to `check`, and a work.advance_state binding under after_merge.
  Second, whether to keep CLAUDE.md gated, having reported that under a blocking check every
