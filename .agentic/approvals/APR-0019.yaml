# Approval record, per ADR-019.
#
# Ratifies the product vision. Until now the document stating what AEP is carried no authority
# at all: `type: guide`, `tier: null`, which AUTHORITY_MODEL's own table marks "non-normative,
# carries no authority in conflict resolution", and `status: draft` on top of that. Meanwhile
# six tier-0 specs about hashing, lifecycle, registries, capabilities, evidence and authority
# were approved and gated. The corpus had ratified how it governs itself and never ratified
# what it is.
#
# A 2026-09-04 audit traced the consequence: across 22 accepted ADRs the words `specialist`,
# `recursive` and `definition of done` appear zero times, and 38 of the first 41 work items went
# to the repository's own governance machinery. Effort followed authority.

