scope_note: >
  Accepts ADR-015 (v2), ADR-016 (v2), ADR-017 and ADR-018. No proposed ADR remains.

  The human was offered a split into two acts and chose to accept all four together.
  Recorded because ADR-014 identifies batch approval as a complacency risk, and the
  record should show the choice was made knowingly rather than by omission.

  Accepting ADR-017 makes hand-authored markdown contrary to an accepted decision:
  documents are now a generated projection of structured base data, and no generator
  exists. That inconsistency is live from this record forward and is tracked as
  ADR-017's own stated risk.

  docs/spec/CONTENT_HASHING.md remains `draft`. It was not named and its promotion is
  outside this record.
