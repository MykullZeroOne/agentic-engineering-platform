title: Admit ISA.md at the repository root and bound its authority
description: |
  The project now has an Ideal State Artifact at ISA.md: the articulation of what "done" means
  for AEP as a whole, and the source of the claims the corpus is measured against. It is written
  to whoever opens the repository, so the root is where it belongs.

  That collides with a stated convention. CLAUDE.md permits README.md and CLAUDE.md as the only
  root-level markdown documents, and requires lifecycle front matter on every document outside a
  short exemption list. ISA.md satisfies neither: it sits at the root, and it carries ISA front
  matter rather than the id/type/tier/status/approval fields DOCUMENT_LIFECYCLE.md defines.

  No check breaks today -- scripts/validate_docs.py collects only docs/** and examples/**, so the
  file is invisible to it. That is exactly why the convention needs amending rather than quietly
  outliving its own exception: a rule that the tooling cannot see is enforced by whoever remembers
  it, which is the enforcement stage this repository is trying to leave behind.

  The amendment widens both lists by one file and then bounds what the exception buys. ISA.md is
  not a tier 0-3 artifact, carries no authority over any approved document, is never citable as
  binding intent, and loses to an approved artifact wherever the two disagree. Without that bound
  a root-level document sitting outside AUTHORITY_MODEL.md is a hole in the authority model, not
  a carve-out from a formatting rule.

  Scope is deliberately narrow: admit the file, bound it, and land the ISA itself. It does not
  move the ISA into the corpus, does not give it a document type or a lifecycle, does not extend
  validate_docs.py to cover the root, and does not reconcile its claims against the work store.
  Those are separate decisions, and the last two are recorded in the ISA's own Remaining Work.

  This declared platform_config when it was filed, and the declaration was wrong. The gate's
  path triggers cover .agentic/project.yaml, registries, hooks and roles -- not CLAUDE.md, which
  gates.yaml names as the gate's `sources` rather than a trigger -- so check_gates.py never fired.
  The declaration rested on CLAUDE.md's own table gating "anything altering a gate, policy, or
  required check", read as covering a root-document rule and an authority bound.

  RULING (principal, 2026-09-01, chat): amending a documentation convention in CLAUDE.md is not a
  platform_config change. This is the second time the same ruling has been given: APR-0011's
  scope_note records "Ungate it, move the policy instead", with CLAUDE.md removed as a trigger
  path and the policy content deferred to WI-0020. The declaration here was made by an agent
  that had read the table and not the record, which is exactly the findability problem WI-0039
  exists to fix.

  required_gates is therefore empty, and the item advances to done on the next `work advance`
  rather than holding at awaiting_human. This is a correction of a wrong declaration, not the
  closing of a gate: no gate applied, so no approval record is written, and none is owed. Had
  the ruling gone the other way, an approval record naming this item would have been the only
  thing that could close it (WI-0040).

  Declaring the gate was still the right instinct at the time. Before WI-0040, an undeclared
  gate would have auto-closed the question at merge; declared, it surfaced. The mechanism then
  turned out to be broken in a different way, which the declaration is what exposed.
serves: [governance]
