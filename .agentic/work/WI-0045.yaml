id: WI-0045
store: local
project: PRJ-mykullzeroone/agentic-engineering-platform
type: feat
work_state: intake
priority: high
title: Implement the project and agent-identity registry
description: |
  Phase 1, roadmap bullet 4. ADR-002: a role is a durable identity, a runtime is transient. The
  registry is where that becomes structural: agent identities with memory, permissions and
  hierarchy that persist across sessions and provider changes. Today roles are an empty
  directory (.agentic/roles/.gitkeep) and identities exist only in prose.

  Serves ISC-2 (a role naming a model fails validation), ISC-3 (swapping every provider changes
  no organisational row) and ISC-25. Done when a role file naming a provider is rejected at load,
  and a provider swap in runtime_preferences leaves the registry tables byte-identical.

  Partially served by the Simple First Mile (2026-09-08): `.agentic/roles/engineer.primary.yaml`
  is the first durable agent identity, and `devctl doctor` now rejects a role naming a runtime,
  model or provider at any depth, or carrying any value equal to a provider token in
  runtime_preferences. That is ISC-2's probe; the claim is checked in ISA.md only when a
  reconcile records it. ISC-3 and ISC-25 remain open: nothing yet swaps a provider and compares
  organisational state, and there is no registry beyond a directory of YAML files. This item
  stays open for them.
serves: [ISC-2, ISC-3, ISC-25]
required_gates: []
dependencies: [WI-0042, WI-0043]
