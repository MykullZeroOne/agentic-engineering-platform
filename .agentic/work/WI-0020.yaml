title: Move the merge and branching policy out of CLAUDE.md into tier 3
description: |
  CLAUDE.md carries the merge requirements, the branching strategy and the merge strategy.
  That is tier-3 policy with real force living in an agent guide, which WI-0015 recorded as
  a defect and did not fix.

  It was briefly gated: WI-0014 added CLAUDE.md as a platform_config trigger path. Under
  --strict that made every edit to it require an approval record, including wording fixes --
  three pull requests touched it in one day. The trigger has been removed again, so the
  policy is ungated once more. That is the state to fix, not to leave.

  Gate the policy, not the guide. Extract the merge requirements, the branching rules and
  the merge strategy into docs/policies/ as tier-3 artifacts, which constitutional_change or
  a tier-3 trigger then covers on their own paths. CLAUDE.md keeps agent guidance and points
  at them, so a wording fix to the guide is not an approval event and a change to the merge
  rules is.

  Blocked on WI-0006: docs/policies/ does not exist, and the Policy-and-Standard decision --
  one Rule entity with a kind field -- is made but has produced no artifacts. This is the
  first real thing that layer would hold, which makes it a better forcing function for
  WI-0006 than the abstract question was.

  Note the ordering trap. Creating the first tier-3 artifacts is itself a gated change under
  the new blocking check, and the gate covering tier 3 has not been decided -- no gate
  triggers on docs/policies/ at all today. Deciding that trigger is part of this work, not a
  prerequisite discovered halfway through it.

  DONE HERE, 2026-09-08: POL-001 is approved (APR-0022), so the CLAUDE.md side of this item is
  unblocked. Collapsed the "Branching strategy" and "Merging strategy" sections into one
  "Branching and merging" section: it now names POL-001 as the artifact with authority, uses
  POL-001's rule ids (B1-B7, M1-M6) instead of restating rule text, and keeps only the
  reasoning and incident history POL-001 deliberately leaves out (the B2 carve-outs' twenty-PR
  day, the B6 rebase-vs-merge-commit story behind PR #9, the M1 missing-trailer story behind
  PRs #8 and #9, the no-local-git-test-for-a-merged-branch note, the M4 single-identity
  suspension with the 2026-09-01 adversarial-review numbers, and "revert first, diagnose
  second"). The naming grammar block and the gate-table pointer are kept as-is. The
  "Change classes that always require human approval" table moved inside the new section
  unedited; reconciling its rows against POL-001/gates.yaml is WI-0039, not this item.

  Also rewrote the "Open gaps" paragraph: tier 3 now has one artifact (POL-001), so that
  clause no longer says tier 3 has none. Also dropped the evidence-package clause: checked
  SPEC-EVIDENCE-PACKAGE's front matter, it is tier 0 and approved (APR-0016) and its body
  defines an `evidence/v1` schema, so "the evidence package has no defined structure" is now
  false in CLAUDE.md's own terms. `docs/spec/REGISTRIES.md`'s known-gaps entry for the
  evidence package is more precise than what CLAUDE.md said (it already distinguishes "shape"
  from "schema" and calls the schema still missing) but is arguably also stale given
  SPEC-EVIDENCE-PACKAGE's `## Schema` section; that file is tier 0 and gated
  (`constitutional_change`), so it was left untouched here.

  NOT DONE HERE: the gate table under "Change classes" is unreconciled with POL-001 and
  `.agentic/registries/gates.yaml`; that is WI-0039. `docs/spec/REGISTRIES.md`'s known-gaps
  entry is still stale on tier 3 and possibly on the evidence package; it is tier 0 and gated,
  so it was not touched here.
serves: [governance]
required_gates: []
