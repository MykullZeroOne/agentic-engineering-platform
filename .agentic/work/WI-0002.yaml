title: Define the agent capability namespace and grant semantics
description: |
  production_secrets and billing_configuration both trigger on 'an agent requests a capability'
  against a namespace with no defined membership, so neither security gate can fire. Define the
  namespace as a closed registry, deny-beats-allow precedence, and wildcard expansion at grant
  time rather than check time. Recorded as a known gap in SPEC-REGISTRIES.
