id: WI-0013
store: local
project: PRJ-mykullzeroone/agentic-engineering-platform
type: ci
work_state: done
priority: high
title: Clear gate debt, make the gate check blocking, derive work state
description: |
  Follow-on to WI-0012. Replaying PR #5 through check_gates.py finds two gates that
  merged open, and both are still open on `main`:

    constitutional_change  SPEC-CAPABILITIES (no record), SPEC-LIFECYCLE and
                           SPEC-REGISTRIES (APR-0005 approved an earlier version)
    platform_config        .agentic/project.yaml, registries/gates.yaml,
                           registries/vocabularies.yaml (no record names them)

  Closing these needs a human approval and a record; an agent may only write the record
  down (Principle 1). Once clear, add `--strict` to the CI step and move the six
  path-triggered gates from `enforcement: prose` to `check` in the same change. Not
  before: `check` means a check enforces the rule, and while the step is advisory it
  does not, so bumping the stage early would make the registry claim a stage the
  pipeline is not at.

  Also bind `after_merge` so work state stops being hand-copied. `work_state: done` means
  "merged and consolidated", but a merge happens after a pull request's content is frozen,
  so no work item can record its own completion inside the pull request that completes it.
  Every item needs a trailing bookkeeping PR, and that PR is itself work that needs
  recording -- PR #6 was the first turn of that crank and WI-0012 the second. Nothing
  computes work_state; the validator checks the token is valid, never that it is true.

  Add a `work.advance_state` binding under `after_merge` in .agentic/hooks/hooks.yaml,
  class `soft`: advance each work item the merged pull request closed, to `done` when its
  required_gates are all covered by an approval record and to `awaiting_human` when they
  are not. `soft` matches the three bindings already there -- after a merge there is no
  lifecycle progression left for a hard failure to block. Both `after_merge` and the
  `work` hook-ID domain already exist in hook-points.yaml, so this coins no vocabulary.

  That binding is declarative until a hook engine exists, so this change should also give
  check_gates.py the same derivation as a CI check, which is the `check` rung under it on
  the enforcement ladder. Touching hooks.yaml crosses platform_config, which this work
  item already has to close.

  Note also that platform_config's three paths are YAML, where legacy/truncated-32 is
  undefined -- it is specified over a markdown body. Their records can name the path but
  their currency cannot be verified until canonical/v2 exists (ADR-016, WI-0005).
  DONE. The gate debt cleared first, by APR-0007 through APR-0010, so --strict had
  something to enforce rather than a backlog to trip over. The six path-triggered gates
  moved to enforcement `check` in the same change; the other six stay `prose` because they
  trigger on classification, finding, lifecycle or capability, none of which a check can
  read. work.advance_state is bound under after_merge, class soft, and stays declarative
  until a hook engine exists.
  Auditing what --strict would actually block turned up an exposure worth naming: PRINCIPLES
  and ADR-001..008 are approved or accepted and CANNOT carry an approval record, because
  validate_docs.py requires approval_record: null on them. Under a blocking check they would
  have been permanently unmergeable -- enforcement turning into a wall rather than a gate.
  check_gates.py now recognises them from the same PRE_RECORD_APPROVALS set the validator
  uses, reports them as GRAND, and does not block. The summary says so rather than claiming
  every gate is closed, because waving something through and calling it approved is the
  overclaim this check exists to catch. ADR-016 attestation (WI-0005) is the real fix.
serves: [governance]

required_gates:
- platform_config
dependencies:
